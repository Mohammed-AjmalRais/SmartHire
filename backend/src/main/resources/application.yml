server:
  port: 8080
  servlet:
    context-path: /

spring:
  application:
    name: smarthire-backend
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:h2}
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB

# SmartHire Application Custom Properties
smarthire:
  jwt:
    secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
    expiration-ms: 86400000 # 24 hours
  upload:
    dir: uploads
    resumes-dir: uploads/resumes
  mail:
    simulation-mode: true # logs emails to console/system logs when SMTP is unconfigured

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: alpha

logging:
  level:
    com.smarthire: DEBUG
    org.springframework.security: INFO
